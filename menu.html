<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#982f32">
<title>Royal Pearl | Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--food:#982f32;--bar:#211c22;--gold:#d5ad70;--accent:var(--food);--paper:#fff8eb}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#eee7dc;color:#282323;font-family:"DM Sans",sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--accent);color:white;padding:12px 14px 14px;box-shadow:0 3px 14px #0003}
.header-row{display:flex;align-items:center;gap:12px;max-width:1000px;margin:auto}
.back{border:1px solid #ffffff88;background:#ffffff1b;color:white;border-radius:3px;padding:10px 14px;font-weight:700;cursor:pointer}
.title{font:600 clamp(22px,4vw,30px) "Cormorant Garamond",Georgia,serif;flex:1}
.kind{font:600 9px "DM Sans",sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-top:2px}
.search-area{max-width:760px;margin:13px auto 0;position:relative}
#searchInput{width:100%;height:49px;border:1px solid #e5d9ca;border-radius:3px;padding:0 48px 0 17px;font:14px "DM Sans",sans-serif;color:#242424;outline-offset:3px}
.search-icon{position:absolute;right:17px;top:12px;font-size:22px;color:#65534c}
#searchResults{display:none;max-width:760px;margin:8px auto 0;background:white;color:#222;border-radius:4px;overflow:hidden;max-height:48vh;overflow-y:auto;box-shadow:0 5px 18px #0003}
.result{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;border-bottom:1px solid #eee;cursor:pointer}
.result:last-child{border-bottom:0}.result:hover,.result:focus{background:#fbf2e5;outline:none}
.result-name{font-size:14px;font-weight:700}.result-meta{font-size:11px;color:#777;margin-top:4px}.price{font-weight:700;color:var(--accent);white-space:nowrap}
.no-results{padding:18px;text-align:center;font-size:14px;color:#666}
.menu-label{background:#35272a;color:#f7e9d2;text-align:center;padding:10px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
#pdfLoading{padding:18px;text-align:center;color:#555;font-size:14px}
#pdfViewer{padding:8px;background:#342f30;min-height:60vh}
.pdf-page{width:100%;max-width:1000px;margin:0 auto 12px;background:white;scroll-margin-top:160px;box-shadow:0 2px 10px #0004}
.pdf-page canvas{display:block;width:100%;height:auto}
.error{background:white;color:#6a1018;padding:20px;text-align:center;line-height:1.6}
body.bar-mode{background:#1d1a1d}
body.bar-mode header{background:#211c22}
body.bar-mode .back{border-color:#cba568;color:#e8cb96}
body.bar-mode .title{color:#f0d49d}
body.bar-mode .kind{color:#d9bd8a}
body.bar-mode .menu-label{background:#171518;color:#d9b779}
body.bar-mode #pdfViewer{background:#171518}
body.bar-mode .price{color:#9b6927}
@media(max-width:600px){header{padding:10px}.header-row{gap:8px}.back{padding:9px 11px;font-size:13px}.title{font-size:23px}#searchInput{height:47px;font-size:14px}#pdfViewer{padding:4px}.pdf-page{margin-bottom:7px}}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <button class="back" type="button" onclick="location.href='index.html'">← Menus</button>
    <div class="title"><div id="menuTitle">Royal Pearl Menu</div><div class="kind">Royal Pearl · Family Restaurant</div></div>
  </div>
  <div class="search-area">
    <input id="searchInput" type="search" placeholder="Search menu items..." autocomplete="off" aria-label="Search menu items">
    <span class="search-icon" aria-hidden="true">⌕</span>
  </div>
  <div id="searchResults" role="listbox" aria-label="Search results"></div>
</header>
<div class="menu-label" id="pdfTitle">Complete Menu</div>
<div id="pdfLoading">Loading menu pages…</div>
<main id="pdfViewer" aria-label="Full menu PDF pages"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="menu-data.js"></script>
<script>
(() => {
  const type = new URLSearchParams(location.search).get("type") === "bar" ? "bar" : "food";
  const isBar = type === "bar";
  const pdfUrl = isBar ? "bar-menu.pdf" : "food-menu.pdf";
  const data = (window.MENU_DATA && window.MENU_DATA[type]) || [];
  const accent = isBar ? "#211c22" : "#982f32";
  document.documentElement.style.setProperty("--accent", accent);
  if (isBar) document.body.classList.add("bar-mode");
  document.querySelector('meta[name="theme-color"]').content = accent;
  document.title = "Royal Pearl | " + (isBar ? "Bar Menu" : "Food Menu");
  document.getElementById("menuTitle").textContent = isBar ? "Bar Menu" : "Food Menu";
  document.getElementById("pdfTitle").textContent = isBar ? "✧ Complete Bar Menu ✧" : "✧ Complete Food Menu ✧";

  const input = document.getElementById("searchInput");
  const results = document.getElementById("searchResults");
  const viewer = document.getElementById("pdfViewer");
  const loading = document.getElementById("pdfLoading");
  let renderGeneration = 0;

  function normalize(value) {
    return String(value || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/&/g, " and ").replace(/[^a-z0-9]+/g, " ").trim();
  }

  function showResults(query) {
    results.innerHTML = "";
    const q = normalize(query);
    if (!q) { results.style.display = "none"; return; }
    const terms = q.split(/\s+/);
    const matches = data.map(item => {
      const searchable = normalize([item.name, item.category, ...(item.aliases || [])].join(" "));
      const exact = searchable.includes(q);
      const allTerms = terms.every(term => searchable.includes(term));
      return {item, score: exact ? 0 : allTerms ? 1 : 99};
    }).filter(x => x.score < 99)
      .sort((a,b) => a.score-b.score || a.item.name.localeCompare(b.item.name))
      .slice(0, 30);

    results.style.display = "block";
    if (!matches.length) {
      results.innerHTML = '<div class="no-results">No matching items found. Try another spelling.</div>';
      return;
    }
    for (const {item} of matches) {
      const row = document.createElement("div");
      row.className = "result";
      row.tabIndex = 0;
      row.setAttribute("role", "option");
      const left = document.createElement("div");
      const name = document.createElement("div");
      name.className = "result-name";
      name.textContent = item.name;
      const meta = document.createElement("div");
      meta.className = "result-meta";
      meta.textContent = item.category + " · PDF page " + item.page;
      const price = document.createElement("div");
      price.className = "price";
      price.textContent = item.price === "As per size/availability" || item.price === "As per size" ? item.price : "₹" + item.price;
      left.append(name, meta);
      row.append(left, price);
      const jump = () => {
        const target = document.getElementById("pdf-page-" + item.page);
        results.style.display = "none";
        input.blur();
        if (target) {
          target.scrollIntoView({behavior:"smooth", block:"start"});
          target.animate([{outline:"3px solid #d5ad70"},{outline:"0px solid transparent"}], {duration:1300});
        } else {
          loading.textContent = "That PDF page is not ready yet. Please try again in a moment.";
        }
      };
      row.addEventListener("click", jump);
      row.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); jump(); } });
      results.appendChild(row);
    }
  }
  input.addEventListener("input", () => showResults(input.value));
  document.addEventListener("click", e => {
    if (!e.target.closest(".search-area") && !e.target.closest("#searchResults")) results.style.display = "none";
  });

  async function loadPdf() {
    const generation = ++renderGeneration;
    try {
      if (!window.pdfjsLib) throw new Error("The PDF viewer library did not load. Check your internet connection.");
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
      if (generation !== renderGeneration) return;
      viewer.innerHTML = "";
      const containers = [];
      for (let pageNo=1; pageNo<=pdf.numPages; pageNo++) {
        const section = document.createElement("section");
        section.className = "pdf-page";
        section.id = "pdf-page-" + pageNo;
        section.setAttribute("aria-label", "Menu page " + pageNo);
        viewer.appendChild(section);
        containers.push(section);
      }
      for (let pageNo=1; pageNo<=pdf.numPages; pageNo++) {
        if (generation !== renderGeneration) return;
        const page = await pdf.getPage(pageNo);
        const section = containers[pageNo-1];
        const baseViewport = page.getViewport({scale:1});
        const availableWidth = Math.max(240, section.clientWidth || viewer.clientWidth - 16);
        const scale = availableWidth / baseViewport.width;
        const viewport = page.getViewport({scale});
        const outputScale = Math.min(window.devicePixelRatio || 1, 2);
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d", {alpha:false});
        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = "100%";
        canvas.style.height = "auto";
        section.appendChild(canvas);
        await page.render({canvasContext:context, viewport, transform:outputScale !== 1 ? [outputScale,0,0,outputScale,0,0] : null}).promise;
      }
      loading.style.display = "none";
    } catch (error) {
      loading.innerHTML = "";
      const message = document.createElement("div");
      message.className = "error";
      message.textContent = "Could not load the menu PDF. Please check that food-menu.pdf and bar-menu.pdf are uploaded beside index.html and menu.html. " + error.message;
      loading.appendChild(message);
    }
  }
  loadPdf();
})();
</script>
</body>
</html>
